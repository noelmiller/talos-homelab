name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  kubernetes:
    name: Render and schema-check every layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: kustomize build --enable-helm
        run: |
          set -euo pipefail
          mkdir -p rendered
          for dir in 01-infrastructure 02-configuration 03-media 05-dashboard 06-virtualization 07-minecraft 08-monitoring 09-palworld 11-unifi 12-coder 13-forgejo 14-keycloak 15-velero 16-n8n; do
            echo "::group::$dir"
            kubectl kustomize --enable-helm "$dir" > "rendered/$dir.yaml"
            echo "$(grep -c '^kind:' "rendered/$dir.yaml") objects"
            echo "::endgroup::"
          done

      - name: kubeconform
        run: |
          set -euo pipefail
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            rendered/*.yaml 04-gitops/root-app.yaml 04-gitops/apps/*.yaml

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10-linode-relay
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
