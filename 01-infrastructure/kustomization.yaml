apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
  - https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
  - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.12.0/deploy/standalone-install.yaml
  - traefik-namespace.yaml
  - cert-manager-namespace.yaml
  - argocd-namespace.yaml

helmCharts:
  - name: traefik
    repo: https://helm.traefik.io/traefik
    releaseName: traefik
    namespace: traefik
    version: 41.5.0
    includeCRDs: true
    valuesInline:
      providers:
        kubernetesCRD:
          enabled: true
        kubernetesIngress:
          enabled: false
        kubernetesGateway:
          enabled: true
          # Must stay off: Traefik 3.7 lists TCPRoute/TLSRoute at v1alpha2,
          # which the standard-channel CRDs above do not serve. With it on the
          # provider never syncs and every route disappears (default cert,
          # 404 everywhere). TCP routing uses Traefik's own IngressRouteTCP
          # via the kubernetesCRD provider instead.
          experimentalChannel: false
      service:
        type: LoadBalancer
      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
        # Git over SSH for Forgejo, routed by an IngressRouteTCP
        # (13-forgejo/forgejo-routes.yaml) bound to this EntryPoint.
        ssh:
          port: 2222
          expose:
            default: true
          exposedPort: 22
          protocol: TCP
      additionalArguments:
        # HTTP to HTTPS redirection. TLS certificates come from cert-manager
        # (02-configuration/cluster-issuer.yaml), not Traefik's own ACME resolver.
        - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
        - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    releaseName: metrics-server
    namespace: kube-system
    version: 3.14.0

  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    releaseName: sealed-secrets
    namespace: kube-system
    version: 2.20.0
    includeCRDs: true

  - name: cert-manager
    repo: https://charts.jetstack.io
    releaseName: cert-manager
    namespace: cert-manager
    version: v1.21.2
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true

  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    releaseName: argocd
    namespace: argocd
    version: 10.9.1
    includeCRDs: true
    valuesInline:
      global:
        domain: argocd.k8s.noelmiller.dev
      configs:
        params:
          # TLS is terminated at the Traefik gateway; ArgoCD serves plain HTTP behind it.
          server.insecure: true
        cm:
          # our kustomizations use helmCharts, ArgoCD needs this to build them
          kustomize.buildOptions: "--enable-helm"
          # Sign in with Keycloak (14-keycloak) over native OIDC. The `argocd`
          # and `argocd-cli` clients live in 14-keycloak/realm-homelab.json;
          # the secret is sealed for both namespaces, here as
          # 02-configuration/sealed-argocd-keycloak-oidc.yaml. `argocd login
          # --sso` uses the public PKCE client. The local `admin` account
          # stays enabled as break-glass for when Keycloak is down.
          oidc.config: |
            name: Keycloak
            issuer: https://auth.k8s.noelmiller.dev/realms/homelab
            clientID: argocd
            clientSecret: $argocd-keycloak-oidc:client-secret
            cliClientID: argocd-cli
            requestedScopes: ["openid", "profile", "email", "groups"]
        rbac:
          # Keycloak group `argocd-admins` is admin; every other realm user can
          # sign in but has no permissions.
          policy.default: ""
          scopes: "[groups]"
          policy.csv: |
            g, argocd-admins, role:admin
      # Native OIDC above replaces Dex, which otherwise idles with nothing
      # listening on its metrics port and trips TargetDown.
      dex:
        enabled: false

patches:
  - patch: |-
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
            "nodePathMap": [],
            "storageClassConfigs": {
              "nvme-2tb": {
                "nodePathMap": [{"node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/var/mnt/nvme-2tb"]}]
              },
              "sata-8tb": {
                "nodePathMap": [{"node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/var/mnt/sata-8tb"]}]
              },
              "sata-1tb": {
                "nodePathMap": [{"node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/var/mnt/sata-1tb"]}]
              }
            }
          }
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: metallb-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
