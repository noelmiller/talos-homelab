# The default namespace hosts the shared Gateway, the `lan` NetworkAttachmentDefinition,
# and any KubeVirt VMs. baseline admits virt-launcher pods; restricted would not.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
