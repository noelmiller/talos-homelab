apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme-2tb
  annotations:
    # reclaimPolicy is immutable. Replace=true alone runs `kubectl replace`,
    # which is still an update and is rejected; Force=true makes it a
    # delete-and-recreate. Existing PVs/PVCs keep working; they reference the
    # class by name.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    # Provision `local` PVs instead of local-path's default hostPath. Velero
    # (15-velero) can only back up volumes the kubelet mounts under its pod
    # directory, which hostPath PVs bypass. Applies to new volumes only; see
    # 15-velero/README.md for converting an existing one.
    defaultVolumeType: local
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
