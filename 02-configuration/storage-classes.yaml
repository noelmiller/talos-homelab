apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme-2tb
  annotations:
    # reclaimPolicy is immutable. Replace=true alone runs `kubectl replace`,
    # which is still an update and is rejected; Force=true makes it a
    # delete-and-recreate. Existing PVs/PVCs keep working; they reference the
    # class by name.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
