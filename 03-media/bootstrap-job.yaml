apiVersion: batch/v1
kind: Job
metadata:
  name: media-bootstrap
  namespace: media
  annotations:
    # Run as an Argo CD PostSync hook rather than a tracked resource. A tracked
    # Job with ttlSecondsAfterFinished gets garbage-collected, Argo CD then sees
    # it missing and self-heals it back, and the script re-runs forever.
    # BeforeHookCreation deletes the previous Job before creating a new one, so
    # Job immutability no longer requires a manual delete when the script changes.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        # The finished hook pod stays behind in phase Succeeded. Velero's
        # defaultVolumesToFsBackup would still try to back up its mounts and
        # warn on every daily backup that the pod is not running. The same
        # PVCs are backed up through the running app pods.
        backup.velero.io/backup-volumes-excludes: sab-config,sonarr-config,radarr-config,prowlarr-config,library
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
          command: ["/bin/sh", "/scripts/bootstrap-script.sh"]
          securityContext:
            # needs root to chown shared library folders to the app's PUID/PGID
            runAsUser: 0
          env:
            # Hosts SABnzbd will accept in the HTTP Host header (its own reverse-proxy guard).
            - name: SAB_HOST_WHITELIST
              value: "sabnzbd.k8s.noelmiller.dev,sabnzbd,sabnzbd.media,sabnzbd.media.svc.cluster.local,"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: sab-config
              mountPath: /sab-config
              readOnly: true
            - name: sonarr-config
              mountPath: /sonarr-config
              readOnly: true
            - name: radarr-config
              mountPath: /radarr-config
              readOnly: true
            - name: prowlarr-config
              mountPath: /prowlarr-config
              readOnly: true
            - name: library
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: media-bootstrap-script
            defaultMode: 0755
        - name: sab-config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
