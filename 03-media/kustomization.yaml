apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - jellyfin.yaml
  - sabnzbd.yaml
  - sonarr.yaml
  - radarr.yaml
  - prowlarr.yaml
  - sealed-ombi-mysql-secret.yaml
  - ombi-mysql.yaml
  - ombi.yaml
  - bootstrap-job.yaml

configMapGenerator:
  - name: media-bootstrap-script
    namespace: media
    files:
      - bootstrap-script.sh

patches:
  # Never let an Argo CD prune or a cascading Application delete remove a PVC.
  # Data lives on local disks and is not reproducible from git.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
