apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/noelmiller/talos-homelab.git
    targetRevision: main
    path: 03-media
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # the bootstrap Job is immutable once created; don't fight manual delete+recreate cycles
    - group: batch
      kind: Job
      name: media-bootstrap
      jsonPointers:
        - /spec
