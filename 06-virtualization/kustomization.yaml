apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.1/deployments/multus-daemonset-thick.yml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
  - kubevirt-cr.yaml
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.1/cdi-operator.yaml
  - cdi-cr.yaml
  - storage-profiles.yaml
  - https://github.com/kubevirt-manager/kubevirt-manager/releases/download/v1.5.4/bundled-v1.5.4.yaml
  - kubevirt-manager-route.yaml
  - lan-network.yaml

images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.1-thick

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-multus-ds
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: kube-multus
                resources:
                  requests:
                    cpu: 200m
                    memory: 100Mi
                  limits:
                    cpu: 300m
                    memory: 150Mi
  # virt-handler and CDI importer/uploader pods need privileged access (KVM, /dev, hostPID)
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kubevirt
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cdi
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
  # kubevirt-manager already runs as uid 10000 with a read-only root fs; the
  # upstream bundle just omits the remaining fields the restricted profile needs.
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kubevirt-manager
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  - target:
      kind: Deployment
      name: kubevirt-manager
      namespace: kubevirt-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: true
      - op: add
        path: /spec/template/spec/containers/0/securityContext/capabilities
        value:
          drop:
            - ALL
      - op: add
        path: /spec/template/spec/containers/0/securityContext/seccompProfile
        value:
          type: RuntimeDefault
