apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-creative
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-creative
  template:
    metadata:
      labels:
        app: minecraft-creative
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.9.2-java25@sha256:de5d1b1a83eba576f6c8a688fac2a3523ce457724cdebc8ea48d7818b74cdf6e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: minecraft-common-env
          env:
            - name: MEMORY
              value: 4G
            - name: MOTD
              value: Noel's Creative Minecraft Server
            - name: DIFFICULTY
              value: peaceful
            - name: MODE
              value: creative
            - name: FORCE_GAMEMODE
              value: "TRUE"
            - name: PVP
              value: "FALSE"
            - name: SPAWN_PROTECTION
              value: "0"
          ports:
            - name: java
              containerPort: 25565
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: java
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: java
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: java
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rcon
              mountPath: /run/secrets/rcon
              readOnly: true
            - name: bedrock-whitelist
              mountPath: /config/bedrock-whitelist.json
              subPath: bedrock-whitelist.json
              readOnly: true
        - name: backup
          image: itzg/mc-backup:2026.9.2@sha256:709596197b495846c118747c8ad9983f5a6eff03251fb866123d33183d1beb38
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: minecraft-backup-env
          env:
            - name: BACKUP_NAME
              value: minecraft-creative
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
            - name: rcon
              mountPath: /run/secrets/rcon
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-creative-data
        - name: backups
          persistentVolumeClaim:
            claimName: minecraft-creative-backups
        - name: rcon
          secret:
            secretName: minecraft-creative-rcon
            defaultMode: 0440
        - name: bedrock-whitelist
          configMap:
            name: minecraft-bedrock-whitelist
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-creative
  namespace: minecraft
  annotations:
    metallb.io/loadBalancerIPs: 10.42.0.13
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 10.42.0.0/24
  selector:
    app: minecraft-creative
  ports:
    - name: java
      port: 25566
      targetPort: java
      protocol: TCP
    - name: bedrock
      port: 19133
      targetPort: bedrock
      protocol: UDP
