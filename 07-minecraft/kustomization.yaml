apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft

resources:
  - namespace.yaml
  - storage.yaml
  - sealed-rcon-secret.yaml
  - sealed-creative-rcon-secret.yaml
  - server.yaml
  - creative.yaml
  - service.yaml

configMapGenerator:
  - name: minecraft-bedrock-whitelist
    files:
      - bedrock-whitelist.json
  - name: minecraft-common-env
    envs:
      - common.env
  - name: minecraft-backup-env
    envs:
      - backup.env

patches:
  # Never let an Argo CD prune or a cascading Application delete remove a PVC.
  # Data lives on local disks and is not reproducible from git.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
