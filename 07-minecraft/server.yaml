apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: minecraft-common-env
          env:
            - name: MEMORY
              value: 6G
            - name: MOTD
              value: Noel's Minecraft Server
            - name: DIFFICULTY
              value: normal
            - name: MODE
              value: survival
          ports:
            - name: java
              containerPort: 25565
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: java
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: java
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: java
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rcon
              mountPath: /run/secrets/rcon
              readOnly: true
            - name: bedrock-whitelist
              mountPath: /config/bedrock-whitelist.json
              subPath: bedrock-whitelist.json
              readOnly: true
        - name: backup
          image: itzg/mc-backup:2026.10.1@sha256:c5f2c369bbe47d0b712601bf44af5927e67a18cb5816dc378efb45eb993dab0a
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: minecraft-backup-env
          env:
            - name: BACKUP_NAME
              value: minecraft
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
            - name: rcon
              mountPath: /run/secrets/rcon
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: backups
          persistentVolumeClaim:
            claimName: minecraft-backups
        - name: rcon
          secret:
            secretName: minecraft-rcon
            defaultMode: 0440
        - name: bedrock-whitelist
          configMap:
            name: minecraft-bedrock-whitelist
