fullnameOverride: blackbox-exporter

config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions:
          - HTTP/1.0
          - HTTP/1.1
          - HTTP/2.0
        follow_redirects: true
        preferred_ip_protocol: ip4
    tcp_connect:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
    # Palworld's REST API requires HTTP basic auth as "admin" with the server's
    # ADMIN_PASSWORD. A plain TCP connect to 8212 stays green even when the game
    # thread has deadlocked, so this module performs an authenticated request
    # that the server can only answer when it is actually running the world.
    http_2xx_palworld:
      prober: http
      timeout: 10s
      http:
        valid_http_versions:
          - HTTP/1.0
          - HTTP/1.1
          - HTTP/2.0
        valid_status_codes:
          - 200
        preferred_ip_protocol: ip4
        basic_auth:
          username: admin
          password_file: /etc/blackbox/palworld/password

# The Palworld admin password, sealed for the monitoring namespace in
# sealed-blackbox-palworld-rest.yaml. Re-seal it whenever ADMIN_PASSWORD in
# 09-palworld/sealed-secret.yaml is rotated.
extraSecretMounts:
  - name: palworld-rest
    mountPath: /etc/blackbox/palworld
    secretName: blackbox-palworld-rest
    readOnly: true
    defaultMode: 0444

serviceMonitor:
  selfMonitor:
    enabled: true

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
