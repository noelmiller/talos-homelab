# Talos does not expose these control-plane endpoints or certificates through
# the conventional kubeadm paths expected by this chart.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
# Talos runs kube-proxy with the default metrics bind address (127.0.0.1:10249),
# so the scrape can only ever be refused. Exposing it would need
# `cluster.proxy.extraArgs` in the machine config; not worth it on one node.
kubeProxy:
  enabled: false

grafana:
  defaultDashboardsTimezone: browser
  adminPassword: disabled-anonymous-viewer
  env:
    GF_AUTH_ANONYMOUS_ENABLED: "true"
    GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    GF_AUTH_BASIC_ENABLED: "false"
    GF_AUTH_DISABLE_LOGIN_FORM: "true"
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  persistence:
    enabled: true
    storageClassName: sata-1tb
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

alertmanager:
  # Every alert goes to Discord. The webhook URL is never in git: it lives in
  # the alertmanager-discord Secret (sealed-alertmanager-discord.yaml), which
  # the operator mounts at /etc/alertmanager/secrets/alertmanager-discord/.
  config:
    global:
      resolve_timeout: 5m
    templates:
      - /etc/alertmanager/config/*.tmpl
    route:
      receiver: discord
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog fires constantly as a heartbeat; InfoInhibitor exists only
        # to suppress info-level noise. Neither should reach a human.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        # "Default storage class has no smart clone or ReadWriteMany" is
        # permanently true on a single node with local-path, and harmless:
        # CDI falls back to host-assisted copy. The rule belongs to the CDI
        # operator, which reverts edits, so drop it here instead.
        - receiver: "null"
          matchers:
            - alertname = CDIDefaultStorageClassDegraded
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
    # Same inhibit rules as the chart defaults, restated because setting
    # `config` replaces the whole block.
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
  alertmanagerSpec:
    secrets:
      - alertmanager-discord
    retention: 120h
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: sata-1tb
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 25GB
    walCompression: true
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: sata-1tb
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  # No CPU limit: average use is ~3m, but each scrape runs every collector at
  # once across all cores, and a CFS quota throttled ~40% of periods
  # (CPUThrottlingHigh) without saving anything.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
