apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - sealed-alertmanager-discord.yaml
  - grafana-route.yaml
  - native-metrics.yaml
  - probes.yaml
  - probe-alerts.yaml
  - service-overview-dashboard.yaml
  - unifi-dashboard.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: monitoring
    namespace: monitoring
    version: 91.4.1
    includeCRDs: true
    valuesFile: kube-prometheus-stack-values.yaml
  - name: prometheus-blackbox-exporter
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: blackbox
    namespace: monitoring
    version: 11.18.0
    valuesFile: blackbox-exporter-values.yaml

patches:
  # Never let an Argo CD prune or a cascading Application delete remove a PVC.
  # Data lives on local disks and is not reproducible from git.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
