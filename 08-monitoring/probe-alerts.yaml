apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-probes
  namespace: monitoring
spec:
  groups:
    - name: application-availability
      rules:
        - alert: ApplicationServiceUnavailable
          expr: probe_success{job=~"application-(http|tcp)"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Service probe failed for {{ $labels.instance }}"
            description: "{{ $labels.instance }} has failed its {{ $labels.service_type }} probe for more than five minutes."
        - alert: ApplicationServiceSlow
          expr: probe_duration_seconds{job="application-http"} > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Slow response from {{ $labels.instance }}"
            description: "{{ $labels.instance }} has taken more than five seconds to respond for ten minutes."
