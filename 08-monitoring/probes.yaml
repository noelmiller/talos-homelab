apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: application-http
  namespace: monitoring
spec:
  jobName: application-http
  interval: 30s
  scrapeTimeout: 15s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        service_type: http
      static:
        - http://jellyfin.media.svc.cluster.local:8096/
        - http://ombi.media.svc.cluster.local:3579/
        - http://prowlarr.media.svc.cluster.local:9696/
        - http://radarr.media.svc.cluster.local:7878/
        - http://sabnzbd.media.svc.cluster.local:8080/
        - http://sonarr.media.svc.cluster.local:8989/
        - https://dashboard.k8s.noelmiller.dev/
        - http://argocd-server.argocd.svc.cluster.local/
        - http://kubevirt-manager.kubevirt-manager.svc.cluster.local:8080/
        - http://monitoring-grafana.monitoring.svc.cluster.local/
        - http://coder.coder.svc.cluster.local/healthz
        - http://forgejo-http.forgejo.svc.cluster.local:3000/api/healthz
        - http://keycloak.keycloak.svc.cluster.local:9000/health/ready
        - http://n8n.n8n.svc.cluster.local:5678/healthz/readiness
        - http://outline.outline.svc.cluster.local:3000/_health
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: application-tcp
  namespace: monitoring
spec:
  jobName: application-tcp
  interval: 30s
  scrapeTimeout: 15s
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        service_type: tcp
      static:
        - ombi-mysql.media.svc.cluster.local:3306
        - minecraft.minecraft.svc.cluster.local:25565
        - minecraft-creative.minecraft.svc.cluster.local:25566
        - unifi-unifi-os-server-webui.unifi.svc.cluster.local:443
        - unifi-unifi-os-server-communication.unifi.svc.cluster.local:8080
        - forgejo-ssh.forgejo.svc.cluster.local:22
        - forgejo-postgresql.forgejo.svc.cluster.local:5432
        - keycloak-postgresql.keycloak.svc.cluster.local:5432
        - n8n-postgresql.n8n.svc.cluster.local:5432
        - outline-postgresql.outline.svc.cluster.local:5432
        - outline-redis.outline.svc.cluster.local:6379
        - kubernetes.default.svc.cluster.local:443
        # End-to-end through the Linode relay, Tailscale, and pfSense back to
        # the MetalLB addresses. Fails if any hop in the public game path breaks.
        - 172.233.217.64:25565
        - 172.233.217.64:25566
---
# Palworld is probed through its authenticated REST API rather than a TCP
# connect (see http_2xx_palworld in blackbox-exporter-values.yaml). It shares
# the application-http job so the existing availability alerts apply.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: palworld-rest
  namespace: monitoring
spec:
  jobName: application-http
  interval: 30s
  scrapeTimeout: 15s
  module: http_2xx_palworld
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        service_type: http
      static:
        - http://palworld-monitoring.palworld.svc.cluster.local:8212/v1/api/info
