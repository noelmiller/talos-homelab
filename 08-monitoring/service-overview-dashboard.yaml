              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(probe_success{job=~\"application-(http|tcp)\"} == 0)",
              "instant": true,
              "legendFormat": "unhealthy",
              "range": false,
              "refId": "A"
