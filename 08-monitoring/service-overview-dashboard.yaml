                  "__name__": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "metrics_path": true,
                  "node": true,
                  "service": true
                },
                "indexByName": {},
                "renameByName": {
                  "Value": "Used",
                  "namespace": "Namespace",
                  "persistentvolumeclaim": "Persistent volume claim"
