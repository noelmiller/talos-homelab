systemIp: 10.42.0.15

extraEnv:
  TZ: America/Chicago

service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    metallb.io/allow-shared-ip: unifi-os-server
    metallb.io/loadBalancerIPs: 10.42.0.15

ports:
  webui:
    enabled: true
    port: 443
    targetPort: 443
    protocol: TCP
  communication:
    enabled: true
    port: 8080
    targetPort: 8080
    protocol: TCP
  stun:
    enabled: true
    port: 3478
    targetPort: 3478
    protocol: UDP
  discovery:
    enabled: true
    port: 10003
    targetPort: 10003
    protocol: UDP

persistence:
  data:
    storageClass: sata-1tb
    size: 30Gi
  mongo:
    storageClass: nvme-2tb
    size: 10Gi
  backups:
    enabled: true
    storageClass: sata-1tb
    size: 20Gi

# Prometheus exporter (unpoller) for real UniFi metrics: clients, AP/switch
# health, PoE, throughput. Auth uses a dedicated local-only admin account
# (Settings -> Admins & Users -> Add Admin -> Local Access Only). The
# password is stored in a SealedSecret (see
# 11-unifi/sealed-unifi-exporter-secret.yaml) rather than plaintext here.
unifiExporter:
  enabled: true
  config:
    verifyTLS: false
    saveSites: true
    username: unpoller
  existingSecret:
    name: unifi-exporter-creds
    passwordKey: password
  serviceMonitor:
    enabled: true
