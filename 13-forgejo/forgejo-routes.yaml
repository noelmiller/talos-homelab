# Defaulted Gateway API fields (parentRefs.group/kind, backendRefs.group/kind/
# weight) are set explicitly so Argo CD's ServerSideApply diff does not flag
# the routes as perpetually OutOfSync (see 12-coder/coder-route.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: default
      sectionName: websecure
  hostnames:
    - git.k8s.noelmiller.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: forgejo-http
          port: 3000
          weight: 1
---
# Git over SSH. Traefik's `ssh` EntryPoint (LAN port 22 on the Traefik
# LoadBalancer IP, see 01-infrastructure) forwards raw TCP to the Forgejo SSH
# Service, so `git@git.k8s.noelmiller.dev` works through the same DNS record
# as HTTPS. This is a Traefik CRD rather than a Gateway API TCPRoute because
# Traefik only handles TCPRoute with its experimental channel enabled, which
# breaks the whole Gateway provider against the standard-channel CRDs.
# SSH has no SNI, so the only possible match is HostSNI(`*`).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forgejo-ssh
          port: 22
