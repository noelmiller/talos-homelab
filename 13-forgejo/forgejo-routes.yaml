# Defaulted Gateway API fields (parentRefs.group/kind, backendRefs.group/kind/
# weight) are set explicitly so Argo CD's ServerSideApply diff does not flag
# the routes as perpetually OutOfSync (see 12-coder/coder-route.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: default
      sectionName: websecure
  hostnames:
    - git.k8s.noelmiller.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: forgejo-http
          port: 3000
          weight: 1
---
# Git over SSH. Traefik's `ssh` entrypoint (LAN port 22 on the Traefik
# LoadBalancer IP) is bound to the Gateway's `ssh` TCP listener, so
# `git@git.k8s.noelmiller.dev` works through the same DNS record as HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: default
      sectionName: ssh
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: forgejo-ssh
          port: 22
          weight: 1
