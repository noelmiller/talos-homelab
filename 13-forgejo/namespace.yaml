apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  # Forgejo's rootless image and the Bitnami PostgreSQL image both run as
  # non-root with a read-only root filesystem, so the namespace can enforce
  # restricted. Verify with `kubectl label --dry-run=server` before relaxing.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
