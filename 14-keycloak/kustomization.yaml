apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - sealed-keycloak-postgresql.yaml
  - sealed-keycloak-admin.yaml
  - sealed-keycloak-forgejo-client.yaml
  - sealed-keycloak-coder-client.yaml
  - sealed-keycloak-argocd-client.yaml
  - sealed-keycloak-github-idp.yaml
  - keycloak.yaml
  - keycloak-route.yaml
  - realm-import-job.yaml

# Hashed name: editing the realm file rolls the import Job.
configMapGenerator:
  - name: keycloak-realm
    namespace: keycloak
    files:
      - realm-homelab.json

helmCharts:
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    releaseName: keycloak-postgresql
    namespace: keycloak
    version: 18.11.4
    valuesFile: postgresql-values.yaml

patches:
  # Never let an Argo CD prune or a cascading Application delete remove a PVC.
  # Data lives on local disks and is not reproducible from git.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
