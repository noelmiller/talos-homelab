apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  # The official Keycloak image and the Bitnami PostgreSQL image both run as
  # non-root, so the namespace can enforce restricted.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
