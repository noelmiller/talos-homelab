apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-backups
  namespace: velero
spec:
  groups:
    - name: velero-backups
      rules:
        - alert: VeleroBackupStale
          # 26h: one missed daily run plus slack for a slow upload.
          expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 93600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No successful Velero backup for schedule {{ $labels.schedule }} in over 26 hours"
            description: "Check `velero backup get` and the BackupStorageLocation (`velero backup-location get`); Backblaze credentials or connectivity are the usual causes."
        - alert: VeleroBackupNeverSucceeded
          # The timestamp series only appears with the first success, so a
          # schedule that has never worked needs its own rule.
          expr: |-
            velero_backup_success_total{schedule!=""} == 0
            unless on (schedule) velero_backup_last_successful_timestamp
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: "Velero schedule {{ $labels.schedule }} has never produced a successful backup"
            description: "Check `velero backup get` and `velero backup describe <name> --details`."
        - alert: VeleroBackupFailed
          # Counters, not velero_backup_last_status: a backup that fails while
          # uploading its metadata leaves that gauge at 1.
          expr: |-
            increase(velero_backup_failure_total{schedule!=""}[1h]) > 0
            or increase(velero_backup_partial_failure_total{schedule!=""}[1h]) > 0
            or increase(velero_backup_validation_failure_total{schedule!=""}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "A Velero backup for schedule {{ $labels.schedule }} failed or partially failed in the last hour"
            description: "Inspect it with `velero backup describe <name> --details` and `velero backup logs <name>`; `status.failureReason` on the Backup has the fatal error."
        - alert: VeleroVolumeNotBackupCapable
          # Velero skips volumes on hostPath PVs with nothing but a log
          # warning, so the backup still reports Completed. local-path only
          # provisions `local` PVs since the StorageClasses gained
          # defaultVolumeType; older volumes need the conversion in README.md.
          # media-library is excluded on purpose (volume-policy.yaml).
          expr: |-
            (
              kube_persistentvolume_info{host_path!=""}
                * on (persistentvolume) group_left (claim_namespace, name)
              kube_persistentvolume_claim_ref
            )
            unless on (claim_namespace, name)
              kube_persistentvolume_claim_ref{claim_namespace="media", name="media-library"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Volume {{ $labels.claim_namespace }}/{{ $labels.name }} is on a hostPath PV and is not in any Velero backup"
            description: "Its manifests are backed up but its data is not. Convert {{ $labels.persistentvolume }} to a `local` PV (15-velero/README.md)."
