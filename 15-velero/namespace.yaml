apiVersion: v1
kind: Namespace
metadata:
  name: velero
  annotations:
    # Same wave as the SealedSecrets (see kustomization.yaml); Argo CD applies
    # Namespaces first within a wave.
    argocd.argoproj.io/sync-wave: "-1"
  # The node-agent DaemonSet runs as root and mounts the kubelet's pod
  # directory from the host to read volume contents, which baseline forbids.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
