apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nvme-2tb
  resources:
    requests:
      # Workflows, credentials, and executions live in PostgreSQL. This holds
      # the instance settings file and binary data. local-path does not enforce
      # the size.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  # Single main instance on a ReadWriteOnce volume: never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      # The Service is named `n8n`, so service links would inject
      # N8N_PORT=tcp://..., which n8n reads as its listen port and fails on.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: n8nio/n8n:2.40.3@sha256:e397d0aab215cc1a3ed865bd0c2d7982dff9390fa298f3c188d084425cd6fb16
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: n8n-postgresql
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              value: n8n
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-postgresql
                  key: password
            # Encrypts stored credentials. Without it n8n generates one into the
            # data volume; losing it makes every saved credential unreadable.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption-key
                  key: encryption-key
            - name: N8N_PORT
              value: "5678"
            # Editor URL. TLS terminates at Traefik, one proxy hop away.
            - name: N8N_HOST
              value: n8n.k8s.noelmiller.dev
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.k8s.noelmiller.dev
            - name: N8N_PROXY_HOPS
              value: "1"
            # Public base URL shown for production webhooks. Only /webhook/ is
            # published there, by cloudflared (cloudflared-config.yaml).
            - name: WEBHOOK_URL
              value: https://hooks.noelmiller.dev/
            - name: GENERIC_TIMEZONE
              value: America/Chicago
            - name: TZ
              value: America/Chicago
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_METRICS
              value: "true"
            # The Todoist workflow's Code node computes an HMAC with a secret
            # from the environment. n8n 2.x blocks both by default. Opening env
            # access lets any workflow read this pod's environment, database
            # password included; acceptable on a single-user instance.
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: crypto
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: TODOIST_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-todoist-discord
                  key: todoist-client-secret
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: n8n-todoist-discord
                  key: discord-webhook-url
            # JSON object of Todoist project name -> Discord webhook URL, one
            # per channel (seal-project-webhook.sh). Projects not listed, and
            # everything when this is absent, go to DISCORD_WEBHOOK_URL. Read
            # at start-up: restart the Deployment after the Secret changes.
            - name: DISCORD_PROJECT_WEBHOOKS
              valueFrom:
                secretKeyRef:
                  name: n8n-discord-project-webhooks
                  key: project-webhooks
                  optional: true
            # The Discord application's Ed25519 public key, which verifies
            # slash-command requests, and the one server allowed to send them
            # (setup-discord-command.sh). Neither is a credential; they are
            # sealed to keep the server ID out of a public repository.
            - name: DISCORD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-discord-interactions
                  key: public-key
                  optional: true
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: n8n-discord-interactions
                  key: guild-id
                  optional: true
            # Lets the relay post as the application, the only kind of message
            # that can carry a working Done button. Without it, or where the
            # bot cannot post, messages go through the channel webhooks.
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-discord-interactions
                  key: bot-token
                  optional: true
          ports:
            - name: http
              containerPort: 5678
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: n8n
  ports:
    - name: http
      port: 5678
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
