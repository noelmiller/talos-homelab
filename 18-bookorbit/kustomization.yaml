apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - sealed-bookorbit-postgresql.yaml
  - sealed-bookorbit-secrets.yaml
  - sealed-seedbox-ftp.yaml
  - bookorbit.yaml
  - bookorbit-route.yaml

configMapGenerator:
  # The seedbox-proxy sidecar's script; the name hash rolls the pod when it changes.
  - name: seedbox-proxy
    namespace: bookorbit
    files:
      - seedbox-proxy/seedbox_proxy.py

helmCharts:
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    releaseName: bookorbit-postgresql
    namespace: bookorbit
    version: 18.12.2
    valuesFile: postgresql-values.yaml

patches:
  # Never let an Argo CD prune or a cascading Application delete remove a PVC.
  # Data lives on local disks and is not reproducible from git.
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
