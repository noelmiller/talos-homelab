apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-nvme-2tb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nvme-2tb
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-sata-8tb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sata-8tb
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-sata-1tb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sata-1tb
  resources:
    requests:
      storage: 5Gi
---
# volumeBindingMode is WaitForFirstConsumer, so a pod must exist to trigger binding
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-nvme-2tb
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "echo hello from nvme-2tb && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc-nvme-2tb
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-sata-8tb
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "echo hello from sata-8tb && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc-sata-8tb
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-sata-1tb
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "echo hello from sata-1tb && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc-sata-1tb
---
